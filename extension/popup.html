<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { width: 300px; margin: 0; padding: 14px; font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; background: #fff7fb; color: #3f2b36; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.sub { font-size: 11px; color: #a8869a; margin: 0 0 12px; line-height: 1.5; }
  label { display: block; font-size: 11px; color: #7d5a6b; margin: 8px 0 4px; }
  input[type="text"] { width: 100%; box-sizing: border-box; height: 30px; border-radius: 8px; border: 1px solid #ffcfe1; padding: 0 8px; font-size: 12px; }
  button { width: 100%; height: 32px; margin-top: 10px; border-radius: 8px; border: 0; background: linear-gradient(135deg, #ff8ab8, #ff5f9e); color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
  .stat { margin-top: 12px; font-size: 11px; color: #6d4a5b; background: #fff; border: 1px solid #ffe0ec; border-radius: 10px; padding: 8px 10px; line-height: 1.8; }
  .stat b { color: #c2436f; }
  .warn { color: #b45309; }
</style>
</head>
<body>
  <h1>🐋 大肥鱼弹幕桥</h1>
  <p class="sub">在 <b>live.douyin.com</b> 的直播间页面开着，就能把弹幕 / 礼物送出去，也能把大肥鱼的回复打回直播间。</p>
  <label>服务地址</label>
  <input id="server" type="text" placeholder="http://127.0.0.1:8787" />
  <label class="row"><input id="enabled" type="checkbox" style="width:auto;height:auto" /> 启用（抓弹幕 + 回写回复）</label>
  <button id="save">保存设置</button>
  <div class="stat" id="stat">读取中…</div>
  <script src="popup.js"></script>
</body>
</html>
